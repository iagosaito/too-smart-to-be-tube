name: Bug report
description: Something on the Categories page or sidebar entry is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Collapse the YouTube sidebar
        2. Open Categories
        3. ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open DevTools (F12) on the YouTube tab and paste any errors related to the extension.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      placeholder: 0.1.0 / a621cfd
