name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build content script
        run: npm run build

      - name: Validate manifest
        run: |
          node --input-type=module -e "
            import { readFileSync, existsSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
            const files = [
              ...manifest.content_scripts.flatMap((script) => [...script.js, ...(script.css ?? [])]),
              ...Object.values(manifest.icons),
            ];
            const missing = files.filter((file) => !existsSync(file));
            if (missing.length) throw new Error('Missing files referenced by manifest: ' + missing.join(', '));
            console.log('manifest.json OK:', files.length, 'files referenced');
          "

      - name: Package extension
        if: matrix.node == 24
        run: zip -r too-smart-to-be-tube.zip manifest.json dist icons src/ui/styles.css

      - name: Upload extension package
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: too-smart-to-be-tube
          path: too-smart-to-be-tube.zip
          retention-days: 14
